[project]
name = "snap-to-league"
version = "0.1.0"
description = "Photo of a tournament board to a live EasyChamp league"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.8"]
dev = ["pytest>=8", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
