<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>League board</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="wrap">
  <header class="bar">
    <a class="brand" href="/"><span class="ec">EasyChamp</span><span class="name">Snap <i>to</i> League</span></a>
    <div class="chips"><span class="chip on" id="updated">Loading</span></div>
  </header>
  <h1 id="name">League</h1>
  <p class="muted" id="sub"></p>
  <div class="ticker" aria-hidden="true" id="ticker" hidden><div class="ticker-track" id="ticker-track"></div></div>
  <section class="panel" id="bracket-panel" hidden><h2>Bracket</h2><div id="bracket"></div></section>
  <div class="grid2">
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="panel" id="table-panel"><h2>Standings</h2><div class="tablebox" id="table"></div></section>
      <section class="panel" id="scorers-panel" hidden><h2>Top scorers</h2><div class="tablebox" id="scorers"></div></section>
    </div>
    <section class="panel"><h2>Matches</h2><div class="board" id="board"></div></section>
  </div>
  <div class="actions">
    <button class="btn ghost" id="read" type="button">Read out</button>
    <button class="btn" id="announcer" type="button">Turn on the announcer</button>
    <span class="muted small" id="announcer-note">Leave this board on a TV: every new result is announced out loud.</span>
  </div>
  <p class="err" id="error" hidden role="alert"></p>
</main>
<script type="module">
import { computeStandings, standingsTable, readOut, esc, speak, bracketHtml, goalsText, topScorers, scorersTable, groupTables, groupTablesHtml, leaderboardHtml } from "/static/standings.js";
const $ = (id) => document.getElementById(id);
const id = location.pathname.split("/").pop();
let league;
let announcer = false;
let lastSeen = null;

const resultOf = (m) => (m.status === "played" ? `${m.homeScore ?? ""}-${m.awayScore ?? ""}-${m.winner ?? ""}` : "");
function newsSince(prev, next) {
  if (!prev) return [];
  const before = new Map(prev.matches.map((m) => [`${m.home}|${m.away}|${m.stage}|${m.round ?? ""}`, resultOf(m)]));
  return next.matches.filter((m) => m.status === "played" && before.get(`${m.home}|${m.away}|${m.stage}|${m.round ?? ""}`) !== resultOf(m))
    .map((m) => {
      if (m.homeScore === null || m.homeScore === undefined) return `${m.winner} goes through.`;
      if (m.homeScore === m.awayScore) return `${m.home} and ${m.away} draw ${m.homeScore} all.`;
      const [w, l, a, b] = m.homeScore > m.awayScore ? [m.home, m.away, m.homeScore, m.awayScore] : [m.away, m.home, m.awayScore, m.homeScore];
      return `${w} beat ${l}, ${a} to ${b}.`;
    });
}

async function load() {
  try {
    const r = await fetch(`/api/leagues/${encodeURIComponent(id)}`);
    if (!r.ok) throw new Error(r.status === 404 ? "This league does not exist" : `HTTP ${r.status}`);
    const next = await r.json();
    const news = newsSince(lastSeen, next);
    league = next; lastSeen = next;
    render();
    if (announcer && news.length) {
      const rows = computeStandings(league.matches, league.teams, league.sport);
      speak(`Result update. ${news.join(" ")} ${rows.length ? `${rows[0].team} lead with ${rows[0].Pts} points.` : ""}`);
    }
    $("error").hidden = true;
  } catch (e) { $("error").textContent = e.message; $("error").hidden = false; }
}

function render() {
  document.title = league.name;
  $("name").textContent = league.name;
  if (!league.matches.length && league.leaderboard) {
    $("sub").textContent = `Leaderboard · ${league.leaderboard.entries.length} entries`;
    $("table-panel").hidden = false; $("bracket-panel").hidden = true; $("scorers-panel").hidden = true;
    $("table-panel").querySelector("h2").textContent = "Leaderboard";
    $("table").innerHTML = leaderboardHtml(league.leaderboard);
    $("board").closest(".panel").hidden = true;
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    return;
  }
  const played = league.matches.filter((m) => m.status === "played").length;
  $("sub").textContent = `${league.sport[0].toUpperCase()}${league.sport.slice(1)} · ${played} of ${league.matches.length} matches played`;
  const results = league.matches.filter((m) => m.status === "played").map((m) => `<span><b>FT</b> ${esc(m.home)} ${m.homeScore ?? ""}-${m.awayScore ?? ""} ${esc(m.away)}</span>`);
  if (results.length) { $("ticker-track").innerHTML = results.concat(results).join(""); $("ticker").hidden = false; }
  $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
  const rows = computeStandings(league.matches, league.teams, league.sport);
  const read = !rows.length && (league.table || []).length ? league.table.map((r) => ({ ...r, D: r.D ?? 0, GF: r.GF ?? 0, GA: r.GA ?? 0, GD: (r.GF ?? 0) - (r.GA ?? 0) })) : null;
  $("table").innerHTML = read ? standingsTable(read) : groupTablesHtml(groupTables(league.matches, league.teams, league.sport));
  $("table-panel").hidden = !rows.length && !read;
  const sc = topScorers(league.matches);
  $("scorers-panel").hidden = !sc.length; $("scorers").innerHTML = scorersTable(sc);
  const br = bracketHtml(league.matches);
  $("bracket").innerHTML = br;
  $("bracket-panel").hidden = !br;
  const stages = [...new Set(league.matches.map((m) => m.stage))];
  $("board").innerHTML = stages.map((s) => `<div class="stagehead">${esc(s === "group" ? "Group stage" : s === "knockout" ? "Knockout" : s)}</div>` + league.matches.filter((m) => m.stage === s).map((m) => `
    <div class="fx"><span class="h">${esc(m.home)}</span>
    <span class="s ${m.status === "played" ? "" : "sched"}">${m.status === "played" ? (m.homeScore !== null && m.homeScore !== undefined ? `${m.homeScore} - ${m.awayScore}` : `${esc(m.winner)} won`) : esc([m.when, m.venue].filter(Boolean).join(" · ") || "vs")}</span>
    <span class="a">${esc(m.away)}</span>${goalsText(m) ? `<span class="g">${esc(goalsText(m))}</span>` : ""}</div>`).join("")).join("");
}

$("announcer").addEventListener("click", async () => {
  announcer = !announcer;
  $("announcer").textContent = announcer ? "Announcer on" : "Turn on the announcer";
  if (announcer) await speak(`Announcer on for ${league ? league.name : "this league"}. New results will be read out here.`);
});
$("read").addEventListener("click", () => league && speak(readOut(league.name, computeStandings(league.matches, league.teams), league.matches)));
load();
setInterval(load, 15000);
</script>
</body>
</html>
